name: release

# Builds the zero-setup Windows installer (and a portable zip) and attaches them
# to the GitHub Release. Runs automatically on a version tag; can also be run by
# hand against an existing tag (e.g. v1.4.0) via the "Run workflow" button.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build + attach (e.g. v1.4.0)'
        required: true

permissions:
  contents: write          # upload assets to the release

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Resolve version from the tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v')
          # A tag the app doesn't know it is would make the updater offer this release forever.
          if (-not (Select-String -Path app.py -SimpleMatch "APP_VERSION = `"$ver`"" -Quiet)) {
            throw "app.py APP_VERSION does not match tag $tag"
          }
          "tag=$tag"     | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$ver" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build app + installer (runs --selftest internally)
        shell: pwsh
        run: .\build.ps1 -Installer -Version ${{ steps.ver.outputs.version }}

      - name: Package a portable zip
        shell: pwsh
        run: |
          # onedir build: zip the whole app folder (exe + _internal\ with ffmpeg).
          Copy-Item "README.md","LICENSE" "dist\TSConverter" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist\TSConverter\*" -DestinationPath "dist\TSConverter-${{ steps.ver.outputs.version }}-portable.zip" -Force

      - name: Attach assets to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            dist/installer/*.exe
            dist/TSConverter-*-portable.zip

      - name: Submit the new version to winget
        if: github.event_name == 'push'
        continue-on-error: true   # best-effort: the release itself is already published
        env:
          # Optional: a classic GitHub PAT (public_repo scope) that updates the winget
          # package (TSConverter.TSConverter). Set on this step only, so no other step
          # (or third-party action) can read it.
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host "WINGET_TOKEN not set; skipping winget."; exit 0 }
          # Pinned and hash-checked: this exe gets the token. To upgrade, take the new
          # release's wingetcreate.exe URL and SHA256 from github.com/microsoft/winget-create.
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.28.1.0/wingetcreate.exe -OutFile wingetcreate.exe
          if ((Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash -ne "63D980BA79E97042395BD6EB5992C2DB9E01E9E7A8A22958A95C288F27310413") {
            throw "wingetcreate.exe does not match the pinned SHA256"
          }
          $tag = "${{ steps.ver.outputs.tag }}"
          $base = "https://github.com/${{ github.repository }}/releases"
          .\wingetcreate.exe update TSConverter.TSConverter --version ${{ steps.ver.outputs.version }} `
            --urls "$base/download/$tag/TSConverter-${{ steps.ver.outputs.version }}-setup.exe" `
            --release-notes-url "$base/tag/$tag" --release-date (Get-Date -Format yyyy-MM-dd) `
            --submit --token $env:WINGET_TOKEN
